# accelerate FSDP full-shard config for scripts/train_lora_fsdp.py.
# Usage: accelerate launch --config_file configs/fsdp.yaml scripts/train_lora_fsdp.py ...
# num_processes is overridden on the CLI to match --gres GPUs.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
use_cpu: false
machine_rank: 0
num_machines: 1
num_processes: 4          # override: accelerate launch --num_processes <#GPUs>
rdzv_backend: static
same_network: true
fsdp_config:
  fsdp_version: 2
  fsdp_sharding_strategy: FULL_SHARD          # shard params + grads + optimizer (ZeRO-3 equiv)
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_offload_params: false                  # set true to spill to CPU if still OOM
  fsdp_use_orig_params: true                  # required for PEFT/LoRA frozen-base params
  fsdp_cpu_ram_efficient_loading: true
  fsdp_activation_checkpointing: false        # SFTConfig handles gradient checkpointing
